<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoja Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #08070b;
      color: #f4f2f7;
      font-family: 'Geist', system-ui, sans-serif;
    }
    main {
      max-width: 1320px;
      margin: 0 auto;
      padding: 48px clamp(16px, 3vw, 32px);
    }
    h1 { margin: 0 0 32px; font-weight: 500; }
    .card {
      padding: clamp(20px, 3vw, 40px);
      border-radius: 28px;
      border: 1px solid rgba(244, 242, 247, .09);
      background: #0D0B10;
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 11.5;
      min-height: min(560px, 125vw);
    }
    .hint {
      position: absolute;
      right: 0;
      top: 0;
      pointer-events: none;
      font: 400 10px 'Geist Mono', ui-monospace, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #7E7B89;
    }
  </style>
</head>
<body>
  <main>
    <h1>Zoja Labs</h1>
    <div class="card">
      <div class="stage">
        <xinhee-evolve src="xinhee/xinhee.xbin" palette="ghost" zoom="1.22" style="position:absolute; inset:0;"></xinhee-evolve>
        <div class="hint">Drag to orbit · Scroll to zoom</div>
      </div>
    </div>
  </main>
  <script src="xinhee/xinhee-evolve.js"></script>
</body>
</html>
